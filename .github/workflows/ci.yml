# CI — hardened 2026-10-24
# - All third-party actions pinned to verified full commit SHAs (see comments).
# - `pull_request` is used for fork PR validation; no pull_request_target workflow exists.
# - Least-privilege GITHUB_TOKEN: contents:read only, no secrets are exposed to PR jobs.
# - Root package.json lifecycle scripts are NOT invoked: a fork PR can rewrite package.json,
#   so validation calls the workspace scripts / binaries directly instead of `pnpm <script>`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # `pnpm -r build` runs every workspace package build without executing the root script.
        run: pnpm -r build

      - name: Verify packed CLI install
        run: |
          mkdir -p "$RUNNER_TEMP/cli-pack"
          pnpm --filter @4evergent/cli pack --pack-destination "$RUNNER_TEMP/cli-pack"
          npm install --prefix "$RUNNER_TEMP/cli-install" "$RUNNER_TEMP"/cli-pack/*.tgz
          expected="$(node -p "require('./apps/cli/package.json').version")"
          actual="$("$RUNNER_TEMP/cli-install/node_modules/.bin/4evergent" --version)"
          test "$actual" = "$expected"

      - name: Validate OpenAPI document
        run: node scripts/check-openapi.mjs

      - name: Lint
        # eslint is invoked from node_modules/.bin; the root `lint` script is not used.
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
