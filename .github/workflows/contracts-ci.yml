# Contracts CI — hardened 2026-10-24
# - All third-party actions pinned to verified full commit SHAs (see comments).
# - `pull_request` is used for fork PR validation; no pull_request_target workflow exists.
# - Least-privilege GITHUB_TOKEN: contents:read only, no secrets are exposed to PR jobs.
name: Contracts CI

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Build and Test (wasm32)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Rust toolchain and wasm32 target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts

      - name: Build (wasm32-unknown-unknown)
        run: cargo build --workspace --locked --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: contracts
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --manifest-path contracts/Cargo.toml
