[workspace]
# TODO: re-enable "permissions" after its own DESIGN pass
members = ["agent-registry"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.81"

[workspace.dependencies]
soroban-sdk = "22.0"

# Standard Soroban contract release profile (matches soroban-cli template used
# by reference Soroban crates; keeps the deployed wasm small and panics abort).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
